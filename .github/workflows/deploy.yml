
name: HTML CI CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: CI - Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check HTML File
        run: test -f index.html

      - name: Validate HTML Content
        run: |
          grep -Eiq '<html([[:space:]>])' index.html
          grep -Eiq '<h1([[:space:]>])' index.html
          grep -Eiq '</html[[:space:]]*>' index.html

      - name: CI Successful
        run: echo "HTML validation passed"

  deploy:
    name: CD - Deploy Website
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
